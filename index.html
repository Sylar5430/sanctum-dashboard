<!DOCTYPE html>
<html>
<head>
    <title>Sanctum Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #eef3f7;
        }

        .navbar {
            background-color: #2b6777;
            padding: 15px;
            display: flex;
            justify-content: space-around;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .section {
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #2b6777;
        }

        .card-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 270px;
            margin: 15px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 6px 12px rgba(0,0,0,0.1);
        }

        .card a {
            display: block;
            margin-top: 10px;
            background: #52ab98;
            color: white;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
        }

        .card a:hover {
            background: #3d8b7d;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    #homeHome</a>
    #directoryPatients</a>
    #articlesArticles</a>
    #staffStaff</a>
    #rulesRules</a>
</div>

<!-- HOME -->
<div class="section" id="home">
    <h1>Welcome to Sanctum</h1>
    <p>This dashboard will guide you through your journey of recovery.</p>
