<!DOCTYPE html>
<html>
<head>
    <title>Sanctum Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #eef3f7;
        }

        /* Navbar */
        .navbar {
            background-color: #2b6777;
            padding: 15px;
            color: white;
            display: flex;
            justify-content: space-around;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        /* Section */
        .section {
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #2b6777;
        }

        /* Cards */
        .card-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 260px;
            margin: 15px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 6px 12px rgba(0,0,0,0.1);
        }

        .card h3 {
            color: #2b6777;
        }

        .card a {
            display: block;
            margin-top: 10px;
            background: #52ab98;
            color: white;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
        }

        .card a:hover {
            background: #3d8b7d;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <a href="#home">Home</a>
